<!DOCTYPE html>

<head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

<body>

<div class="container">
  <!-- Navbar -->
  <nav class="site-nav">
    <a href="#" class="brand-logo">✦ مكتبة الأوامر</a>
    <a href="https://alnoaif2026.github.io" target="_blank" class="external-link">🌐 الرئيسية</a>
  </nav>

  <!-- Hero Header -->
  <header class="hero">
    <h1>الأوامر البصرية والبرمجية</h1>
    <p>تصفح، شارك وأنشئ أوامر البرمجة والذكاء الاصطناعي بسهولة</p>
  </header>

  <!-- Search & Controls -->
  <div class="glass-panel">
    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم الأمر أو الوصف...">
    </div>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="toggleFavFilter()" id="favFilterBtn">⭐ المفضلة</button>
      <button class="btn btn-outline" onclick="exportTXT()">💾 تصدير الكل TXT</button>
      <button class="btn btn-accent" onclick="promptAddCustomCommand()">➕ أمر خاص</button>
    </div>
  </div>

  <!-- Categories Scroll Area -->
  <div class="categories-scroll" id="categories"></div>

  <!-- Prompt Builder Section -->
  <div class="glass-panel">
    <h3 style="color: var(--primary-neon); font-size: 1rem; margin-bottom: 8px;">🧩 مجمع البرومبتات</h3>
    <textarea id="promptBuilder" class="builder-textarea" placeholder="الأوامر المختارة ستظهر هنا..."></textarea>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="copyBuilder()">📋 نسخ الكود</button>
      <button class="btn btn-secondary" onclick="shareTXTBuilder()">📤 مشاركة TXT</button>
      <button class="btn btn-accent" onclick="exportBuilderPNG()">🖼️ مشاركة PNG</button>
      <button class="btn btn-danger" onclick="clearBuilder()">مسح</button>
    </div>
  </div>

  <!-- Cards Main Area -->
  <main style="margin-top: 16px;">
    <div class="commands-grid" id="commandsGrid"></div>
  </main>
</div>

<div class="toast" id="toast">تمت العملية بنجاح!</div>

<!-- Hidden Canvas for Image Export -->
<div id="exportCardCanvas" style="position: absolute; left:-9999px; top:-9999px; width:450px; background:#090d16; color:#fff; padding:24px; border-radius:16px; border:2px solid #00f2fe;">
  <h3 style="color:#00f2fe; margin-bottom:8px; font-size:1.1rem;" id="cardCategoryTag">مكتبة الأوامر البصرية</h3>
  <div id="cardCommandText" style="font-family:monospace; font-size:1.3rem; background:rgba(255,255,255,0.1); padding:12px; border-radius:10px; margin-bottom:10px; color:#00f2fe; direction:ltr;"></div>

</div>

  let currentCategory = "الكل";
  let showOnlyFavs = false;
  let favorites = JSON.parse(localStorage.getItem("promptFav") || "[]");
  let customCmds = JSON.parse(localStorage.getItem("customCmds") || "[]");
  const builder = document.getElementById("promptBuilder");

  function allItems() {
    let arr = [];
    Object.entries(library).forEach(([cat, items]) => {
      items.forEach(item => arr.push({...item, category: cat}));
    });
    return [...arr, ...customCmds];
  }

  function renderCategories() {
    const categoriesDiv = document.getElementById("categories");
    const cats = ["الكل", ...Object.keys(library)];
    if(customCmds.length) cats.push("خاص بي");

    categoriesDiv.innerHTML = cats.map(cat => `
      <button class="cat-pill ${cat === currentCategory && !showOnlyFavs ? 'active' : ''}" 
              onclick="selectCategory('${cat}')">${cat}</button>
    `).join('');
  }

  function selectCategory(cat) {
    currentCategory = cat;
    showOnlyFavs = false;
    document.getElementById("favFilterBtn").style.borderColor = "var(--border)";
    renderCategories();
    renderCommands();
  }

  function toggleFavFilter() {
    showOnlyFavs = !showOnlyFavs;
    document.getElementById("favFilterBtn").style.borderColor = showOnlyFavs ? "var(--primary-neon)" : "var(--border)";
    renderCategories();
    renderCommands();
  }

  function renderCommands() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const grid = document.getElementById("commandsGrid");
    grid.innerHTML = "";

    let filtered = allItems().filter(item => {
      const matchesSearch = item.c.toLowerCase().includes(query) || item.d.toLowerCase().includes(query);
      const matchesCat = currentCategory === "الكل" || item.category === currentCategory;
      const matchesFav = !showOnlyFavs || favorites.includes(item.c);
      return matchesSearch && matchesCat && matchesFav;
    });

    if(filtered.length === 0) {
      grid.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding:30px;">لا توجد نتائج مطابقة</div>`;
      return;
    }

    filtered.forEach(item => {
      const isFav = favorites.includes(item.c);
      const card = document.createElement("div");
      card.className = "command-card";
      card.innerHTML = `
        <div>
          <div class="command-code">${item.c}</div>
          <p class="command-desc">${item.d}</p>
        </div>
        <div class="card-actions">
          <button class="card-btn" onclick="addBuilder('${item.c}')">➕ أضف للمنشئ</button>
          <button class="card-btn" onclick="toggleFavorite('${item.c}')">${isFav ? '★ المفضلة' : '☆ مفضلة'}</button>
          <button class="card-btn" onclick="shareCardPNG('${item.c}', '${item.d}', '${item.category}')">🖼️ مشاركة PNG</button>
          <button class="card-btn" onclick="shareCardTXT('${item.c}', '${item.d}')">📄 مشاركة TXT</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function addBuilder(c) {
    let lines = builder.value.split('\n').filter(x => x.trim());
    if(!lines.includes(c)) {
      lines.push(c);
      builder.value = lines.join('\n');
      showToast("تمت الإضافة لشبكة المنشئ");
    }
  }

  function toggleFavorite(c) {
    favorites = favorites.includes(c) ? favorites.filter(x => x !== c) : [...favorites, c];
    localStorage.setItem("promptFav", JSON.stringify(favorites));
    renderCommands();
  }

  function promptAddCustomCommand() {
    const c = prompt("أدخل كود الأمر (مثال: /my_command):");
    const d = prompt("أدخل وصف الأمر:");
    if(c && d) {
      customCmds.push({c, d, category: "خاص بي"});
      localStorage.setItem("customCmds", JSON.stringify(customCmds));
      renderCategories();
      renderCommands();
      showToast("تمت إضافة الأمر الخاص بك!");
    }
  }

  async function shareCardTXT(c, d) {
    const textData = `الأمر: ${c}\nالوصف: ${d}`;
    if (navigator.share) {
      try {
        await navigator.share({ title: c, text: textData });
      } catch (e) {}
    } else {
      navigator.clipboard.writeText(textData);
      showToast("تم نسخ بيانات الأمر نصياً!");
    }
  }

  async function shareCardPNG(c, d, cat) {
    document.getElementById("cardCommandText").textContent = c;
    document.getElementById("cardDescText").textContent = d;
    document.getElementById("cardCategoryTag").textContent = cat || "أمر بصري";
    
    const canvas = document.getElementById("exportCardCanvas");
    showToast("جاري إعداد الصورة...");

    html2canvas(canvas, { backgroundColor: null, scale: 2 }).then(cvs => {
      cvs.toBlob(async (blob) => {
        const file = new File([blob], `${c.replace('/', '')}.png`, { type: 'image/png' });
        if (navigator.share && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: c, text: d });
          } catch(e) {}
        } else {
          const a = document.createElement('a'); 
          a.href = cvs.toDataURL("image/png"); 
          a.download = `${c.replace('/', '')}.png`; 
          a.click();
          showToast("تم تحفيز تنزيل الصورة!");
        }
      });
    });
  }

  async function shareTXTBuilder() {
    const text = builder.value.trim();
    if(!text) return showToast("المنشئ فارغ!");
    if (navigator.share) {
      try {
        await navigator.share({ title: 'أوامر مجمعة', text: text });
      } catch(e) {}
    } else {
      navigator.clipboard.writeText(text);
      showToast("تم النسخ للحافظة!");
    }
  }

  function exportBuilderPNG() {
    if(!builder.value.trim()) return showToast("المنشئ فارغ!");
    shareCardPNG("أوامر مجمعة", builder.value.trim(), "منشئ البرومبتات");
  }

  function copyBuilder() { 
    if(!builder.value.trim()) return showToast("المنشئ فارغ!");
    navigator.clipboard.writeText(builder.value); 
    showToast("تم نسخ الكود!"); 
  }
  
  function clearBuilder() { builder.value = ""; }

  function exportTXT() {
    const data = allItems().map(i => i.c + " - " + i.d).join("\n");
    const blob = new Blob([data], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "commands.txt";
    a.click();
    showToast("تم تصدير كل الأوامر نصياً!");
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; 
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  document.getElementById("searchInput").addEventListener("input", renderCommands);
  
  renderCategories(); 
  renderCommands();
</script>
