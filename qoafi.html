.add{align-items:stretch}

قالوا كانوا جاءوا ذهبوا رجعوا سمعوا فعلوا عرفوا شكروا حفظوا كتبوا قرأوا سألوا ضحكوا بكوا مشوا ركضوا وصلوا
يا دنيا ثريا عليا حيا رؤيا هيا مرايا هدايا حكايا خفايا سجايا بقايا عطايا نوايا زوايا قضايا ضحايا وصايا`;
const TASHKEEL=/[\u064B-\u065F\u0670\u0640]/g;
const plain=s=>s.replace(TASHKEEL,'').replace(/[^\u0621-\u064A]/g,'');
const norm=s=>plain(s).replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ا').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
const fmt=n=>n.toLocaleString('ar-EG');

const DB_URL='https://haraj-f4400.firebaseio.com';
const cloudCache={};let stats=null,token=0;
async function loadEnding(k){
  if(cloudCache[k])return cloudCache[k];
  try{
    const r=await fetch(DB_URL+'/words/'+encodeURIComponent(k)+'.json?shallow=true');
    if(!r.ok)throw 0;
    const j=await r.json();cloudCache[k]=j?Object.keys(j):[];
    return cloudCache[k];
  }catch(e){return []}
}
async function loadStats(){
  try{
    const r=await fetch(DB_URL+'/stats.json');if(!r.ok)throw 0;
    const j=await r.json();
    if(j&&Object.keys(j).length){stats=j;renderChips()}
  }catch(e){}
}
let words=[];
function rebuild(){words=[...new Set((BASE+' '+DIALECT+' '+MORE).split(/\s+/).map(plain).filter(w=>w.length>=3))]}
rebuild();

let N=2;
const $=id=>document.getElementById(id);
const q=$('q'),out=$('out');

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function wordHTML(w){
  const k=Math.min(N,w.length);
  return `<button class="w" data-w="${esc(w)}">${esc(w.slice(0,-k))}<b>${esc(w.slice(-k))}</b></button>`;
}

function render(){
  const input=norm(q.value);
  let key='';
  if(input.length>=N) key=input.slice(-N);
  if(!key){
    out.innerHTML=`<p class="empty">${input.length?'اكتب '+(N===2?'حرفين':'ثلاثة أحرف')+' على الأقل.':'ابدأ بكتابة كلمة، أو اختر قافية من الأسفل.'}</p>`;
    return;
  }
  const my=++token;
  const match=w=>{const n=norm(w);return n.length>=N&&n.slice(-N)===key&&n!==input};
  const shown=plain(q.value).slice(-N)||key;
  const draw=cloud=>{
    if(my!==token)return;
    const res=[...new Set(words.filter(match).concat(cloud.filter(match)))].sort((a,b)=>a.localeCompare(b,'ar'));
    const head=`<div class="head"><span class="end">ـ${esc(shown)}</span><span class="count">${fmt(res.length)} كلمة</span></div>`;
    out.innerHTML=head+(res.length?`<div class="words">${res.map(wordHTML).join('')}</div>`
      :`<p class="empty">ما وجدنا كلمات بهذه القافية. جرّب آخر حرفين فقط.</p>`);
  };
  draw([]);
  loadEnding(key.slice(-2)).then(c=>{if(c.length)draw(c)});
}

function renderChips(){
  let top,total;
  if(stats&&N===2){
    top=Object.entries(stats).filter(e=>e[1]>0).sort((a,b)=>a[0].localeCompare(b[0],'ar'));
    total=top.reduce((s,e)=>s+e[1],0);
  }else{
    const c={};
    words.forEach(w=>{const n=norm(w);if(n.length>=N){const k=n.slice(-N);c[k]=(c[k]||0)+1}});
    top=Object.entries(c).sort((a,b)=>a[0].localeCompare(b[0],'ar'));
    total=words.length;
  }
  $('total').textContent=fmt(total)+' كلمة في '+fmt(top.length)+' قافية';
  $('chips').innerHTML=top.map(([k,n])=>`<button class="chip" data-k="${k}">ـ${k}<small>${fmt(n)}</small></button>`).join('');
}

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1400)}

out.addEventListener('click',async e=>{
  const b=e.target.closest('.w');if(!b)return;
  try{await navigator.clipboard.writeText(b.dataset.w);toast('نُسخت: '+b.dataset.w)}catch(err){toast(b.dataset.w)}
});
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  q.value=b.dataset.k;render();window.scrollTo({top:0,behavior:'smooth'});
});
function setN(n){N=n;$('n2').setAttribute('aria-pressed',n===2);$('n3').setAttribute('aria-pressed',n===3);render();renderChips()}
$('n2').onclick=()=>setN(2);
$('n3').onclick=()=>setN(3);
q.addEventListener('input',render);
render();renderChips();loadStats();

</script>
