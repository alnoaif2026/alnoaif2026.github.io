<script src="cards.js"></script>


<script>


/* ===============================
   Firebase
================================ */

const FIREBASE_BASE =
  "https://alnoaif-default-rtdb.firebaseio.com";


const META_PATH =
  "__paths";


/* ===============================
   قراءة path
================================ */

const params =
  new URLSearchParams(
    location.search
  );


let currentLibraryPath =
  String(
    params.get("path") || ""
  )
  .trim()
  .replace(/^\/+|\/+$/g, "");


let libraryName =
  "مكتبة الأوامر";


let fetchedCommands = [];

let currentCategory =
  "الكل";

let showOnlyFavs =
  false;


/* ===============================
   المفضلة منفصلة لكل الموقع
================================ */

let favorites =
  JSON.parse(
    localStorage.getItem(
      "promptFav"
    ) || "[]"
  );


/* ===============================
   الأوامر الخاصة لكل مكتبة
================================ */

function customStorageKey() {

  return (
    "customCmds_" +
    currentLibraryPath
  );

}


let customCmds =
  JSON.parse(
    localStorage.getItem(
      customStorageKey()
    ) || "[]"
  );


const builder =
  document.getElementById(
    "promptBuilder"
  );


/* ===============================
   Firebase URL
================================ */

function firebaseURL(path) {

  const encoded =
    String(path || "")
    .replace(/^\/+|\/+$/g, "")
    .split("/")
    .map(
      part =>
        encodeURIComponent(part)
    )
    .join("/");


  return (
    FIREBASE_BASE +
    "/" +
    encoded +
    ".json"
  );

}


/* ===============================
   Escape
================================ */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ===============================
   Metadata
================================ */

async function fetchLibraryMeta() {

  try {

    const response =
      await fetch(
        firebaseURL(META_PATH)
      );


    const data =
      await response.json();


    if (!data) {
      return;
    }


    const meta =
      Object.values(data)
      .find(item => {

        if (
          !item ||
          typeof item !== "object"
        ) {
          return false;
        }


        const path =
          String(
            item.path || ""
          )
          .replace(/^\/+|\/+$/g, "");


        return (
          path ===
          currentLibraryPath
        );

      });


    if (!meta) {
      return;
    }


    libraryName =
      meta.nameAr ||
      libraryName;


    document.getElementById(
      "libraryTitle"
    ).textContent =
      libraryName;


    document.getElementById(
      "libraryDescription"
    ).textContent =
      meta.desc ||
      meta.description ||
      `تصفح أوامر ${libraryName} واختر الأمر الذي يناسبك.`;


    document.title =
      `${libraryName} | مكتبة الأوامر`;

  }

  catch (error) {

    console.error(
      "Meta Error:",
      error
    );

  }

}


/* ===============================
   Parsing Firebase
================================ */

function parseFirebaseCommands(data) {

  const result = [];


  if (!data) {
    return result;
  }


  if (Array.isArray(data)) {

    data.forEach(item => {

      if (
        item &&
        typeof item === "object" &&
        (item.c || item.d)
      ) {

        result.push({

          c:
            item.c || "",

          d:
            item.d || "",

          category:
            item.category ||
            "عام"

        });

      }

    });


    return result;

  }


  if (
    typeof data !== "object"
  ) {
    return result;
  }


  Object.entries(data)
  .forEach(([category, value]) => {


    /* Array */
    if (Array.isArray(value)) {

      value.forEach(item => {

        if (
          item &&
          typeof item === "object" &&
          (item.c || item.d)
        ) {

          result.push({

            c:
              item.c || "",

            d:
              item.d || "",

            category:
              item.category ||
              category ||
              "عام"

          });

        }

      });


      return;

    }


    /* Object */
    if (
      value &&
      typeof value === "object"
    ) {


      if (
        value.c ||
        value.d
      ) {

        result.push({

          c:
            value.c || "",

          d:
            value.d || "",

          category:
            value.category ||
            category ||
            "عام"

        });


        return;

      }


      Object.values(value)
      .forEach(item => {

        if (
          item &&
          typeof item === "object" &&
          (item.c || item.d)
        ) {

          result.push({

            c:
              item.c || "",

            d:
              item.d || "",

            category:
              item.category ||
              category ||
              "عام"

          });

        }

      });

    }

  });


  return result;

}


/* ===============================
   تحميل المكتبة
================================ */

async function loadLibrary() {

  const grid =
    document.getElementById(
      "commandsGrid"
    );


  if (!currentLibraryPath) {

    grid.innerHTML = `

      <div class="firebase-error">

        ❌ لم يتم تحديد القسم.

        <br><br>

        ارجع للصفحة الرئيسية واختر أحد الأقسام.

      </div>

    `;


    document.getElementById(
      "libraryTitle"
    ).textContent =
      "لم يتم تحديد المكتبة";


    return;

  }


  document.getElementById(
    "currentPath"
  ).textContent =
    "/" + currentLibraryPath;


  await fetchLibraryMeta();


  try {

    const response =
      await fetch(
        firebaseURL(
          currentLibraryPath
        )
      );


    if (!response.ok) {

      throw new Error(
        "Firebase error"
      );

    }


    const data =
      await response.json();


    fetchedCommands =
      parseFirebaseCommands(data);


    renderCategories();

    renderCommands();

    updateStats();

  }

  catch (error) {

    console.error(error);


    grid.innerHTML = `

      <div class="firebase-error">

        ❌ تعذر تحميل بيانات المكتبة.

      </div>

    `;

  }

}


/* ===============================
   All items
================================ */

function allItems() {

  return [
    ...fetchedCommands,
    ...customCmds
  ];

}


/* ===============================
   Stats
================================ */

function updateStats() {

  const items =
    allItems();


  document.getElementById(
    "totalCommandsCount"
  ).textContent =
    items.length;


  const favCount =
    items.filter(
      item =>
        favorites.includes(item.c)
    ).length;


  document.getElementById(
    "favoriteCommandsCount"
  ).textContent =
    favCount;

}


/* ===============================
   Categories
================================ */

function renderCategories() {

  const container =
    document.getElementById(
      "categories"
    );


  const set =
    new Set(
      fetchedCommands.map(
        item =>
          item.category ||
          "عام"
      )
    );


  const cats = [
    "الكل",
    ...set
  ];


  if (customCmds.length) {

    cats.push(
      "خاص بي"
    );

  }


  container.innerHTML = "";


  cats.forEach(cat => {

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "cat-pill";


    if (
      cat === currentCategory &&
      !showOnlyFavs
    ) {

      button.classList.add(
        "active"
      );

    }


    button.textContent =
      cat;


    button.addEventListener(
      "click",
      () =>
        selectCategory(cat)
    );


    container.appendChild(
      button
    );

  });

}


/* ===============================
   Select category
================================ */

function selectCategory(cat) {

  currentCategory =
    cat;


  showOnlyFavs =
    false;


  document.getElementById(
    "favFilterBtn"
  ).classList.remove(
    "active"
  );


  renderCategories();

  renderCommands();

}


/* ===============================
   Favorite filter
================================ */

function toggleFavFilter() {

  showOnlyFavs =
    !showOnlyFavs;


  document.getElementById(
    "favFilterBtn"
  ).classList.toggle(
    "active",
    showOnlyFavs
  );


  renderCategories();

  renderCommands();

}


/* ===============================
   Render
================================ */

function renderCommands() {

  const grid =
    document.getElementById(
      "commandsGrid"
    );


  const query =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const filtered =
    allItems()
    .filter(item => {


      const command =
        String(
          item.c || ""
        ).toLowerCase();


      const description =
        String(
          item.d || ""
        ).toLowerCase();


      const category =
        String(
          item.category || ""
        ).toLowerCase();


      const searchMatch =

        command.includes(query) ||

        description.includes(query) ||

        category.includes(query);


      const categoryMatch =

        currentCategory ===
        "الكل"

        ||

        item.category ===
        currentCategory;


      const favMatch =

        !showOnlyFavs

        ||

        favorites.includes(
          item.c
        );


      return (

        searchMatch &&
        categoryMatch &&
        favMatch

      );

    });


  grid.innerHTML = "";


  if (!filtered.length) {

    grid.innerHTML = `

      <div class="empty-results">

        <div class="empty-results-icon">
          🔍
        </div>

        لا توجد نتائج مطابقة.

      </div>

    `;


    updateStats();

    return;

  }


  filtered.forEach(item => {


    const card =
      createCommandCard(

        item,

        {

          favorite:
            favorites.includes(
              item.c
            ),

          onFavorite:
            () =>
              toggleFavorite(
                item.c
              ),

          onCopy:
            () =>
              copyCommand(
                item.c
              ),

          onBuilder:
            () =>
              addBuilder(
                item.c
              ),

          onPNG:
            () =>
              shareCardPNG(
                item.c,
                item.d,
                item.category
              ),

          onTXT:
            () =>
              shareCardTXT(
                item.c,
                item.d
              )

        }

      );


    grid.appendChild(card);

  });


  updateStats();

}


/* ===============================
   Favorite
================================ */

function toggleFavorite(command) {

  if (
    favorites.includes(command)
  ) {

    favorites =
      favorites.filter(
        item =>
          item !== command
      );


    showToast(
      "☆ تمت الإزالة من المفضلة"
    );

  }

  else {

    favorites.push(command);


    showToast(
      "⭐ تمت الإضافة للمفضلة"
    );

  }


  localStorage.setItem(

    "promptFav",

    JSON.stringify(
      favorites
    )

  );


  renderCommands();

}


/* ===============================
   Copy
================================ */

async function copyCommand(command) {

  await copyText(command);

}


/* ===============================
   Copy general
================================ */

async function copyText(text) {

  try {

    await navigator
      .clipboard
      .writeText(text);


    showToast(
      "📋 تم النسخ"
    );

  }

  catch {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    showToast(
      "📋 تم النسخ"
    );

  }

}


/* ===============================
   Builder
================================ */

function addBuilder(command) {

  const lines =
    builder.value
    .split("\n")
    .map(
      line =>
        line.trim()
    )
    .filter(Boolean);


  if (
    lines.includes(command)
  ) {

    showToast(
      "ℹ️ الأمر موجود مسبقاً"
    );

    return;

  }


  lines.push(command);


  builder.value =
    lines.join("\n");


  showToast(
    "✅ تمت الإضافة للمنشئ"
  );

}


/* ===============================
   Custom command
================================ */

function promptAddCustomCommand() {

  let command =
    prompt(
      "أدخل الأمر\nمثال: /mycommand"
    );


  if (!command) {
    return;
  }


  command =
    command.trim();


  let description =
    prompt(
      "أدخل وصف الأمر:"
    );


  if (!description) {
    return;
  }


  description =
    description.trim();


  const exists =
    allItems()
    .some(
      item =>
        String(item.c)
        .toLowerCase()
        ===
        command.toLowerCase()
    );


  if (exists) {

    showToast(
      "⚠️ الأمر موجود مسبقاً"
    );

    return;

  }


  customCmds.push({

    c:
      command,

    d:
      description,

    category:
      "خاص بي"

  });


  localStorage.setItem(

    customStorageKey(),

    JSON.stringify(
      customCmds
    )

  );


  renderCategories();

  renderCommands();


  showToast(
    "✅ تمت إضافة الأمر"
  );

}


/* ===============================
   TXT card
================================ */

async function shareCardTXT(
  command,
  description
) {

  const text =

    `الأمر: ${command}\n` +
    `الوصف: ${description}`;


  if (navigator.share) {

    try {

      await navigator.share({

        title:
          command,

        text

      });

      return;

    }

    catch {}

  }


  copyText(text);

}


/* ===============================
   PNG
================================ */

async function shareCardPNG(
  command,
  description,
  category
) {

  document.getElementById(
    "cardCommandText"
  ).textContent =
    command;


  document.getElementById(
    "cardDescText"
  ).textContent =
    description;


  document.getElementById(
    "cardCategoryTag"
  ).textContent =
    category ||
    libraryName;


  const element =
    document.getElementById(
      "exportCardCanvas"
    );


  showToast(
    "🖼️ جاري تجهيز الصورة"
  );


  try {

    const canvas =
      await html2canvas(
        element,
        {
          scale: 2,
          backgroundColor: null,
          useCORS: true
        }
      );


    canvas.toBlob(
      async blob => {

        if (!blob) {
          return;
        }


        const cleanName =
          command.replace(
            /[\/\\:*?"<>|]/g,
            ""
          ) ||
          "command";


        const file =
          new File(

            [blob],

            cleanName + ".png",

            {
              type:
                "image/png"
            }

          );


        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          try {

            await navigator.share({

              files: [file],

              title:
                command,

              text:
                description

            });

            return;

          }

          catch {}

        }


        const link =
          document.createElement(
            "a"
          );


        link.href =
          canvas.toDataURL(
            "image/png"
          );


        link.download =
          cleanName + ".png";


        link.click();


        showToast(
          "✅ تم إنشاء الصورة"
        );

      },
      "image/png"
    );

  }

  catch (error) {

    console.error(error);

    showToast(
      "❌ تعذر إنشاء الصورة"
    );

  }

}


/* ===============================
   Builder copy
================================ */

function copyBuilder() {

  const text =
    builder.value.trim();


  if (!text) {

    showToast(
      "⚠️ المنشئ فارغ"
    );

    return;

  }


  copyText(text);

}


/* ===============================
   Builder share
================================ */

async function shareTXTBuilder() {

  const text =
    builder.value.trim();


  if (!text) {

    showToast(
      "⚠️ المنشئ فارغ"
    );

    return;

  }


  if (navigator.share) {

    try {

      await navigator.share({

        title:
          libraryName,

        text

      });

      return;

    }

    catch {}

  }


  copyText(text);

}


/* ===============================
   Builder PNG
================================ */

function exportBuilderPNG() {

  const text =
    builder.value.trim();


  if (!text) {

    showToast(
      "⚠️ المنشئ فارغ"
    );

    return;

  }


  shareCardPNG(

    "أوامر مجمعة",

    text,

    libraryName

  );

}


/* ===============================
   Clear Builder
================================ */

function clearBuilder() {

  builder.value = "";

  showToast(
    "🗑️ تم المسح"
  );

}


/* ===============================
   Export all
================================ */

function exportTXT() {

  const items =
    allItems();


  if (!items.length) {

    showToast(
      "⚠️ لا توجد أوامر"
    );

    return;

  }


  const text =
    items.map(item => {

      return (
        item.c +
        "\n" +
        item.d
      );

    })
    .join(
      "\n\n━━━━━━━━━━━━━━\n\n"
    );


  const blob =
    new Blob(
      [text],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    currentLibraryPath +
    ".txt";


  link.click();


  URL.revokeObjectURL(
    url
  );


  showToast(
    "💾 تم تصدير المكتبة"
  );

}


/* ===============================
   Toast
================================ */

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );
