  <style>

    /* ===============================
       عدد العناصر داخل التصنيف
    ================================ */

      display: inline-flex;
      align-items: center;
      justify-content: center;

      height: 24px;

      align-items: center;
      justify-content: center;

      border-radius: 50px;

      font-family: "Fira Code", monospace;

      font-weight: 600;

      line-height: 1;
    }

    .cat-pill.active .cat-count {
      background: rgba(255,255,255,.20);
    }


    /* ===============================
       بطاقة الكود
    ================================ */

    .code-card {
      position: relative;

      display: flex;
      flex-direction: column;

      background:
        linear-gradient(
          145deg,
          rgba(20,36,59,.96),
          rgba(10,22,39,.96)
        );

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 18px;

      padding: 17px;

      min-height: 220px;

      overflow: hidden;

      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .code-card:hover {
      transform: translateY(-3px);

      border-color:
        rgba(51,135,255,.45);

      box-shadow:
        0 16px 35px
        rgba(0,0,0,.16);
    }


    /* ===============================
       رأس بطاقة الكود
    ================================ */

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;

    }

    .code-card-title {

      direction: ltr;
      text-align: left;

      background: #050d18;

      border:
        1px solid
        rgba(124,183,255,.15);

      border-radius: 13px;

      color: #8dd5ff;

      font-family:
        "Fira Code",
        Consolas,
        monospace;

      font-size: 12px;
      font-weight: 500;

      line-height: 1.8;

      tab-size: 4;

      -webkit-overflow-scrolling: touch;
    }

    .code-copy-btn {
      position: absolute;

      top: 8px;
      left: 8px;

      z-index: 3;

      min-width: 70px;

      padding: 6px 10px;

      border-radius: 8px;

      color: #ffffff;

      font-size: 11px;

    }

    .code-copy-btn:hover {
      background: #1d4ed8;
    }

    }


    /* ===============================
       وصف الكود
    ================================ */

    .code-description {

      font-size: 13px;

<script>


/* =========================================================
   Firebase
========================================================= */

const FIREBASE_BASE =
  "https://alnoaif-default-rtdb.firebaseio.com";



/* =========================================================
   قراءة Query
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );


/*
  النظام القديم:

  library.html?path=photography

  النظام الجديد لـ Sketchware:

  library.html?root=sketchware&path=textview
*/


let currentRoot =
  String(
    params.get("root") || ""
  )
  .trim()
  .replace(/^\/+|\/+$/g, "")
  .toLowerCase();


let currentLibraryPath =
  String(
    params.get("path") || ""
  )
  .trim()
  .replace(/^\/+|\/+$/g, "");



/* =========================================================
   أنواع المكتبات
========================================================= */

const LIBRARY_TYPES = {

  sketchware: {

    name:
      "أكواد Sketchware",

    icon:
      "📱",

    back:
      "sketchware.html",

    type:
      "code",

    metaPath:
      "sketchware/__paths"

  },

  androidstudio: {

    name:
      "أكواد Android Studio",

    icon:
      "🤖",

    back:
      "android-studio.html",

    type:
      "code",

    metaPath:
      "androidstudio/__paths"

  },

  html: {

    name:
      "أكواد HTML",

    icon:
      "🌐",

    back:
      "html-codes.html",

    type:
      "code",

    metaPath:
      "html/__paths"

  }

};



/*
  إذا لم يوجد root
  نعتبرها مكتبة أوامر AI القديمة
  الموجودة مباشرة في جذر Firebase
*/

const isCodeLibrary =
  Boolean(
    currentRoot &&
    LIBRARY_TYPES[currentRoot]
  );


const currentLibraryConfig =
  isCodeLibrary
  ? LIBRARY_TYPES[currentRoot]
  : {

      name:
        "مكتبة الأوامر",

      icon:
        "✦",

      back:
        "home.html",

      type:
        "command",

      metaPath:
        "__paths"

    };



/* =========================================================
   Variables
========================================================= */

let libraryName =
  currentLibraryConfig.name;


let fetchedItems = [];


let currentCategory =
  "الكل";


let showOnlyFavs =
  false;



/* =========================================================
   Storage
========================================================= */

function favoritesStorageKey() {

  if (isCodeLibrary) {

    return (
      "codeFav_" +
      currentRoot +
      "_" +
      currentLibraryPath
    );

  }


  /*
    نترك أوامر AI على المفتاح القديم
    حتى لا تضيع المفضلة السابقة
  */

  return "promptFav";

}


let favorites =
  JSON.parse(
    localStorage.getItem(
      favoritesStorageKey()
    ) || "[]"
  );



function customStorageKey() {

  if (isCodeLibrary) {

    return (
      "customCodes_" +
      currentRoot +
      "_" +
      currentLibraryPath
    );

  }


  return (
    "customCmds_" +
    currentLibraryPath
  );

}


let customItems =
  JSON.parse(
    localStorage.getItem(
      customStorageKey()
    ) || "[]"
  );


const builder =
  document.getElementById(
    "promptBuilder"
  );



/* =========================================================
   Firebase URL
========================================================= */

function firebaseURL(path) {

  const cleanPath =
    String(path || "")
    .replace(/^\/+|\/+$/g, "");


  if (!cleanPath) {

    return (
      FIREBASE_BASE +
      "/.json"
    );

  }


  const encoded =
    cleanPath
    .split("/")
    .map(
      part =>
        encodeURIComponent(part)
    )
    .join("/");


  return (
    FIREBASE_BASE +
    "/" +
    encoded +
    ".json"
  );

}



/* =========================================================
   المسار الكامل للبيانات
========================================================= */

function getFirebaseLibraryPath() {

  /*
    AI القديم:
    photography

    Sketchware:
    sketchware/textview
  */

  if (isCodeLibrary) {

    return (
      currentRoot +
      "/" +
      currentLibraryPath
    );

  }


  return currentLibraryPath;

}



/* =========================================================
   Escape
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



/* =========================================================
   إعداد واجهة الصفحة حسب نوع المكتبة
========================================================= */

    heroBadge.textContent =
      "✦ مكتبة ذكية";


    typeBadge.textContent =
      "أوامر الذكاء الاصطناعي";


    searchInput.placeholder =
      "ابحث باسم الأمر أو الوصف...";


    totalLabel.textContent =

    totalIcon.textContent =
      "💻";


    addButton.textContent =
      "➕ أمر خاص";

/* =========================================================
   Metadata
========================================================= */

async function fetchLibraryMeta() {

  try {

    const response =
      await fetch(
        firebaseURL(
          currentLibraryConfig.metaPath
        )
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    if (!data) {
      return;
    }


    const meta =
      Object.values(data)
      .find(item => {

        if (
          !item ||
          typeof item !== "object"
        ) {

          return false;

        }


        const path =
          String(
            item.path || ""
          )
          .replace(
            /^\/+|\/+$/g,
            ""
          );


        return (
          path ===
          currentLibraryPath
        );

      });


    if (!meta) {

      /*
        في حالة عدم وجود metadata
      */

      libraryName =
        currentLibraryPath ||
        currentLibraryConfig.name;


      document.getElementById(
        "libraryTitle"
      ).textContent =
        libraryName;


      document.getElementById(
        "libraryDescription"
      ).textContent =

        isCodeLibrary

        ? `استعرض أكواد ${libraryName} وانسخ الكود الذي تحتاجه.`

        : `تصفح أوامر ${libraryName} واختر الأمر الذي يناسبك.`;


      return;

    }


    libraryName =
      meta.nameAr ||
      currentLibraryPath ||
      currentLibraryConfig.name;


    document.getElementById(
      "libraryTitle"
    ).textContent =

      (
        meta.icon ||
        (
          isCodeLibrary
          ? currentLibraryConfig.icon
          : ""
        )
      )

      +

      (
        meta.icon ||
        isCodeLibrary
        ? " "
        : ""
      )

      +

      libraryName;


    document.getElementById(
      "libraryDescription"
    ).textContent =

      meta.desc ||

      meta.description ||

      (
        isCodeLibrary

        ? `استعرض أكواد ${libraryName} وانسخ الكود مباشرة.`

        : `تصفح أوامر ${libraryName} واختر الأمر الذي يناسبك.`
      );


    document.title =

      `${libraryName} | ${currentLibraryConfig.name}`;

  }

  catch (error) {

    console.error(
      "Meta Error:",
      error
    );

  }

}



/* =========================================================
   Parsing Firebase
========================================================= */

function parseFirebaseData(data) {

  if (isCodeLibrary) {

    return parseFirebaseCodes(
      data
    );

  }


  return parseFirebaseCommands(
    data
  );

}



/* =========================================================
   Parsing AI Commands
========================================================= */

function parseFirebaseCommands(data) {

  const result = [];


  if (!data) {
    return result;
  }


  if (Array.isArray(data)) {

    data.forEach(item => {

      if (
        item &&
        typeof item === "object" &&
        (
          item.c ||
          item.d
        )
      ) {

        result.push({

          c:
            item.c || "",

          d:
            item.d || "",

          category:
            item.category ||
            "عام",

          type:
            "command"

        });

      }

    });


    return result;

  }


  if (
    typeof data !== "object"
  ) {

    return result;

  }


  Object.entries(data)
  .forEach(
    ([category, value]) => {


      if (
        String(category)
        .startsWith("__")
      ) {

        return;

      }


      if (Array.isArray(value)) {

        value.forEach(item => {

          if (
            item &&
            typeof item === "object" &&
            (
              item.c ||
              item.d
            )
          ) {

            result.push({

              c:
                item.c || "",

              d:
                item.d || "",

              category:
                item.category ||
                category ||
                "عام",

              type:
                "command"

            });

          }

        });


        return;

      }


      if (
        value &&
        typeof value === "object"
      ) {


        if (
          value.c ||
          value.d
        ) {

          result.push({

            c:
              value.c || "",

            d:
              value.d || "",

            category:
              value.category ||
              category ||
              "عام",

            type:
              "command"

          });


          return;

        }


        Object.values(value)
        .forEach(item => {

          if (
            item &&
            typeof item === "object" &&
            (
              item.c ||
              item.d
            )
          ) {

            result.push({

              c:
                item.c || "",

              d:
                item.d || "",

              category:
                item.category ||
                category ||
                "عام",

              type:
                "command"

            });

          }

        });

      }

    }
  );


  return result;

}



/* =========================================================
   Parsing Codes
========================================================= */

function parseFirebaseCodes(data) {

  const result = [];


  if (!data) {
    return result;
  }


  /*
    عنصر كود واحد
  */

  if (
    data &&
    typeof data === "object" &&
    !Array.isArray(data) &&
    (
      data.code ||
      data.title
    )
  ) {

    result.push({

      title:
        data.title ||
        data.name ||
        "كود برمجي",

      code:
        data.code ||
        data.c ||
        "",

      desc:
        data.desc ||
        data.d ||
        "",

      category:
        data.category ||
        "عام",

      type:
        "code"

    });


    return result;

  }


  /*
    Array مباشر
  */

  if (Array.isArray(data)) {

    data.forEach(item => {

      const parsed =
        normalizeCodeItem(
          item,
          "عام"
        );


      if (parsed) {

        result.push(
          parsed
        );

      }

    });


    return result;

  }


  if (
    typeof data !== "object"
  ) {

    return result;

  }


  /*
    تصنيفات
  */

  Object.entries(data)
  .forEach(
    ([category, value]) => {


      if (
        String(category)
        .startsWith("__")
      ) {

        return;

      }


      /*
        Array
      */

      if (Array.isArray(value)) {

        value.forEach(item => {

          const parsed =
            normalizeCodeItem(
              item,
              category
            );


          if (parsed) {

            result.push(
              parsed
            );

          }

        });


        return;

      }


      /*
        Object
      */

      if (
        value &&
        typeof value === "object"
      ) {


        /*
          عنصر واحد
        */

        if (
          value.code ||
          value.title ||
          value.c
        ) {

          const parsed =
            normalizeCodeItem(
              value,
              category
            );


          if (parsed) {

            result.push(
              parsed
            );

          }


          return;

        }


        /*
          Firebase object indexed
        */

        Object.values(value)
        .forEach(item => {

          const parsed =
            normalizeCodeItem(
              item,
              category
            );


          if (parsed) {

            result.push(
              parsed
            );

          }

        });

      }

    }
  );


  return result;

}



/* =========================================================
   Normalize Code
========================================================= */

function normalizeCodeItem(
  item,
  category
) {

  if (
    !item ||
    typeof item !== "object"
  ) {

    return null;

  }


  const code =
    String(
      item.code ??
      item.c ??
      ""
    );


  if (!code.trim()) {

    return null;

  }


  return {

    title:
      String(
        item.title ??
        item.name ??
        "كود برمجي"
      ).trim(),

    code:
      code,

    desc:
      String(
        item.desc ??
        item.d ??
        ""
      ).trim(),

    category:
      String(
        item.category ??
        category ??
        "عام"
      ).trim(),

    type:
      "code"

  };

}



/* =========================================================
   تحميل المكتبة
========================================================= */

async function loadLibrary() {

  const grid =
    document.getElementById(
      "commandsGrid"
    );


  if (!currentLibraryPath) {

    grid.innerHTML = `

      <div class="firebase-error">

        ❌ لم يتم تحديد القسم.

        <br><br>

        ارجع إلى صفحة الأقسام
        واختر أحد الأقسام.

      </div>

    `;


    document.getElementById(
      "libraryTitle"
    ).textContent =
      "لم يتم تحديد المكتبة";


    return;

  }


  await fetchLibraryMeta();


  try {

    const fullPath =
      getFirebaseLibraryPath();


    const response =
      await fetch(
        firebaseURL(
          fullPath
        )
      );


    if (!response.ok) {

      throw new Error(
        "Firebase error"
      );

    }


    const data =
      await response.json();


    fetchedItems =
      parseFirebaseData(
        data
      );


    renderCategories();

    renderItems();

    updateStats();

  }

  catch (error) {

    console.error(
      error
    );


    grid.innerHTML = `

      <div class="firebase-error">

        ❌ تعذر تحميل بيانات المكتبة.

      </div>

    `;

  }

}

    items.filter(
      item =>

  document.getElementById(
    "favoriteCommandsCount"
  ).textContent =

/* =========================================================
   عدد عناصر التصنيف
========================================================= */

function getCategoryCount(category) {

  const items =
    allItems();


  if (
    category === "الكل"
  ) {

    return items.length;

  }


  if (
    category === "خاص بي"
  ) {

    return customItems.length;

  }


  return items.filter(
    item => {

      return (
        (
          item.category ||
          "عام"
        ) ===
        category
      );

    }
  ).length;

}

========================================================= */

function renderCategories() {

  const container =

      "categories"
    );


  const set =

      fetchedItems.map(
        item =>
          item.category ||
          "عام"
      )
    );

    "الكل",
    ...set
  ];

    !cats.includes(

    )
  ) {

    cats.push(

    );

  }


  container.innerHTML =
    "";


  cats.forEach(cat => {

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "cat-pill";


    if (
      cat === currentCategory &&
      !showOnlyFavs
    ) {

      button.classList.add(
        "active"
      );

    }


    const nameSpan =
      document.createElement(
        "span"
      );


    nameSpan.textContent =

      document.createElement(
        "span"
      );

    );

    );

    );

/* =========================================================
   Render AI Commands
========================================================= */

function renderCommands() {

  const grid =
    document.getElementById(
      "commandsGrid"
    );


  const query =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const filtered =
    allItems()
    .filter(item => {


      const command =
        String(
          item.c || ""
        ).toLowerCase();


      const description =
        String(
          item.d || ""
        ).toLowerCase();


      const category =
        String(
          item.category || ""
        ).toLowerCase();


      const searchMatch =

        command.includes(query) ||

        description.includes(query) ||

        category.includes(query);


      const categoryMatch =

        currentCategory ===
        "الكل"

        ||

        item.category ===
        currentCategory;


      const favMatch =

        !showOnlyFavs

        ||

        favorites.includes(
          item.c
        );


      return (

        searchMatch &&
        categoryMatch &&
        favMatch

      );

    });


  grid.innerHTML =
    "";


  if (!filtered.length) {

    showEmptyResults(
      grid
    );

    updateStats();

    return;

  }


  filtered.forEach(item => {


    /*
      نستخدم cards.js القديم
      لمكتبة أوامر AI فقط
    */

    const card =
      createCommandCard(

        item,

        {

          favorite:
            favorites.includes(
              item.c
            ),

          onFavorite:
            () =>
              toggleFavoriteItem(
                item
              ),

          onCopy:
            () =>
              copyText(
                item.c
              ),

          onBuilder:
            () =>
              addBuilder(
                item.c
              ),

          onPNG:
            () =>
              shareCardPNG(
                item.c,
                item.d,
                item.category
              ),

          onTXT:
            () =>
              shareCardTXT(
                item.c,
                item.d
              )

        }

      );


    grid.appendChild(
      card
    );

  });


  updateStats();

}

/* =========================================================
   Favorite
========================================================= */

function toggleFavoriteItem(item) {

  const key =
    getFavoriteKey(
      item
    );


  if (!key) {
    return;
  }


  if (
    favorites.includes(
      key
    )
  ) {

    favorites =
      favorites.filter(
        value =>
          value !== key
      );


    showToast(
      "☆ تمت الإزالة من المفضلة"
    );

  }

  else {

    favorites.push(
      key
    );


    showToast(
      "⭐ تمت الإضافة للمفضلة"
    );

  }


  localStorage.setItem(

    favoritesStorageKey(),

    JSON.stringify(
      favorites
    )

  );


  renderItems();

}



/* =========================================================
   Copy
========================================================= */

async function copyText(text) {

  try {

    await navigator
      .clipboard
      .writeText(
        text
      );


    showToast(
      "📋 تم النسخ"
    );

  }

  catch {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    showToast(
      "📋 تم النسخ"
    );

  }

}



/* =========================================================
   Builder
========================================================= */

function addBuilder(text) {

  const currentText =
    builder.value.trim();


  /*
    في الأكواد قد يحتوي النص
    على أكثر من سطر
  */

  if (
    currentText &&
    currentText.includes(
      text
    )
  ) {

    showToast(
      isCodeLibrary
      ? "ℹ️ الكود موجود مسبقاً"
      : "ℹ️ الأمر موجود مسبقاً"
    );


    return;

  }


  if (!currentText) {

    builder.value =
      text;

  } else {

    builder.value =
      currentText +
      "\n\n" +
      text;

  }


  showToast(
    isCodeLibrary
    ? "✅ تمت إضافة الكود للمجمع"
    : "✅ تمت الإضافة للمنشئ"
  );

}

/* =========================================================
   TXT AI card
========================================================= */

async function shareCardTXT(
  command,
  description
) {

  const text =

    `الأمر: ${command}\n` +
    `الوصف: ${description}`;


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          command,

        text:
          text

      });


      return;

    }

    catch {}

  }


  copyText(
    text
  );

}

   Share code
========================================================= */

      ? `\n\nالوصف:\n${item.desc}`

  ) {

      await navigator.share({

          "كود برمجي",

        text:
          text

      });


      return;

    }

    catch {}

  }


  copyText(

  );

}



/* =========================================================
   PNG
========================================================= */

async function shareCardPNG(
  command,
  description,
  category
) {

  document.getElementById(
    "cardCommandText"
  ).textContent =
    command;


  document.getElementById(
    "cardDescText"
  ).textContent =
    description;


  document.getElementById(
    "cardCategoryTag"
  ).textContent =
    category ||
    libraryName;


  const element =
    document.getElementById(
      "exportCardCanvas"
    );


  showToast(
    "🖼️ جاري تجهيز الصورة"
  );


  try {

    const canvas =
      await html2canvas(
        element,
        {
          scale: 2,
          backgroundColor: null,
          useCORS: true
        }
      );


    canvas.toBlob(
      async blob => {

        if (!blob) {
          return;
        }


        const cleanName =
          String(command)
          .replace(
            /[\/\\:*?"<>|]/g,
            ""
          )
          .substring(
            0,
            60
          )
          ||
          (
            isCodeLibrary
            ? "code"
            : "command"
          );


        const file =
          new File(

            [blob],

            cleanName +
            ".png",

            {
              type:
                "image/png"
            }

          );


        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          try {

            await navigator.share({

              files:
                [file],

              title:
                command,

              text:
                description

            });


            return;

          }

          catch {}

        }


        const link =
          document.createElement(
            "a"
          );


        link.href =
          canvas.toDataURL(
            "image/png"
          );


        link.download =
          cleanName +
          ".png";


        link.click();


        showToast(
          "✅ تم إنشاء الصورة"
        );

      },
      "image/png"
    );

  }

  catch (error) {

    console.error(
      error
    );


    showToast(
      "❌ تعذر إنشاء الصورة"
    );

  }

}

/* =========================================================
   Builder share
========================================================= */

async function shareTXTBuilder() {

  const text =
    builder.value.trim();


  if (!text) {

    showToast(
      isCodeLibrary
      ? "⚠️ مجمع الأكواد فارغ"
      : "⚠️ المنشئ فارغ"
    );


    return;

  }


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          libraryName,

        text:
          text

      });


      return;

    }

    catch {}

  }


  copyText(
    text
  );

}

/* =========================================================
   Export TXT
========================================================= */

function exportTXT() {

  const items =
    allItems();


  if (!items.length) {

    showToast(
      isCodeLibrary
      ? "⚠️ لا توجد أكواد"
      : "⚠️ لا توجد أوامر"
    );


    return;

  }


  let text =
    "";


  if (isCodeLibrary) {

    text =
      items
      .map(item => {

        return (

          "العنوان: " +
          (
            item.title ||
            "كود برمجي"
          ) +

          "\n\n" +

          (
            item.code ||
            ""
          ) +

          (
            item.desc

            ? "\n\nالوصف: " +
              item.desc

            : ""
          )

        );

      })
      .join(
        "\n\n━━━━━━━━━━━━━━━━━━━━\n\n"
      );

  } else {

    text =
      items
      .map(item => {

        return (
          item.c +
          "\n" +
          item.d
        );

      })
      .join(
        "\n\n━━━━━━━━━━━━━━\n\n"
      );

  }


  const blob =
    new Blob(
      [text],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =

    (
      isCodeLibrary

      ? currentRoot +
        "_" +
        currentLibraryPath

      : currentLibraryPath
    )

    +

    ".txt";


  link.click();


  URL.revokeObjectURL(
    url
  );


  showToast(
    "💾 تم تصدير المكتبة"
  );

}



/* =========================================================
   Toast
========================================================= */

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}
