<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مكتبة الأوامر البصرية</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f2fe;
      --primary-dark: #4facfe;
      --secondary: #7f00ff;
      --accent: #ff007f;
      --bg-main: #090d16;
      --bg-surface: rgba(22, 30, 46, 0.85);
      --bg-card: rgba(30, 41, 59, 0.7);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.15);
      --radius: 14px;
      --radius-lg: 20px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-main);
      background-image: 
        radial-gradient(at 10% 10%, rgba(127, 0, 255, 0.2) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(0, 242, 254, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 40px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .container { 
      width: 100%; 
      max-width: 1000px; 
      margin: 0 auto; 
      padding: 0 12px; 
    }

    /* Navigation Bar */
    .site-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .brand-logo {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      color: transparent;
      text-decoration: none;
    }
    .external-link {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: var(--transition);
    }
    .external-link:active {
      background: var(--primary);
      color: #000;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 10px 0 20px;
    }
    .hero h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 30%, var(--primary));
      -webkit-background-clip: text;
      color: transparent;
    }
    .hero p {
      color: var(--text-secondary);
      font-size: 0.92rem;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Glass Panels */
    .glass-panel {
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
    }

    .search-wrapper { position: relative; margin-bottom: 12px; }
    .search-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    /* Buttons Layout */
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 9px 14px;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 0.82rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition);
      flex: 1 1 auto;
      text-align: center;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #000; }
    .btn-secondary { background: linear-gradient(135deg, var(--secondary), #5a00b8); color: #fff; }
    .btn-accent { background: linear-gradient(135deg, var(--accent), #cc0066); color: #fff; }
    .btn-outline { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    /* Categories Scroll */
    .categories-scroll { 
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      padding-bottom: 6px; 
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .categories-scroll::-webkit-scrollbar { display: none; }
    .cat-pill {
      white-space: nowrap;
      padding: 8px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
      transition: var(--transition);
    }
    .cat-pill.active {
      background: var(--primary);
      color: #000;
      font-weight: 700;
      border-color: var(--primary);
    }

    /* Single Column Layout (No Sidebar) */
    .commands-grid { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 14px; 
    }

    @media (min-width: 640px) {
      .commands-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .command-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: var(--transition);
    }
    .command-code {
      direction: ltr;
      font-family: monospace;
      font-size: 1rem;
      font-weight: bold;
      color: var(--primary);
      background: rgba(0, 242, 254, 0.08);
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-all;
      display: inline-block;
    }
    .command-desc { 
      color: var(--text-secondary); 
      font-size: 0.88rem; 
      line-height: 1.5;
    }

    /* Card Actions */
    .card-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .card-btn {
      padding: 8px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .card-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Builder Textarea */
    .builder-textarea {
      width: 100%; 
      min-height: 100px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--primary);
      padding: 12px;
      direction: ltr;
      font-family: monospace;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 10px;
      resize: vertical;
    }

    /* Toast */
    .toast {
      position: fixed; 
      bottom: 20px; 
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--primary); 
      color: #000;
      padding: 10px 24px; 
      border-radius: 50px;
      font-weight: 700; 
      font-size: 0.88rem;
      transition: var(--transition);
      z-index: 1000; 
      opacity: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
    .toast.show { 
      transform: translateX(-50%) translateY(0); 
      opacity: 1; 
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Navbar -->
  <nav class="site-nav">
    <a href="#" class="brand-logo">✦ مكتبة الأوامر</a>
    <a href="https://alnoaif2026.github.io" target="_blank" class="external-link">🌐 الرئيسية</a>
  </nav>

  <!-- Hero Header -->
  <header class="hero">
    <h1>الأوامر البصرية</h1>
    <p>تصفح شارك وأنشئ أوامر التصوير والذكاء الاصطناعي بسهولة</p>
  </header>

  <!-- Search & Controls -->
  <div class="glass-panel">
    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم الأمر أو الوصف...">
    </div>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="toggleFavFilter()" id="favFilterBtn">⭐ المفضلة</button>
      <button class="btn btn-outline" onclick="exportTXT()">💾 تصدير الكل TXT</button>
      <button class="btn btn-accent" onclick="promptAddCustomCommand()">➕ أمر خاص</button>
    </div>
  </div>

  <!-- Categories Scroll Area -->
  <div class="categories-scroll" id="categories"></div>

  <!-- Prompt Builder Section -->
  <div class="glass-panel">
    <h3 style="color: var(--primary); font-size: 1rem; margin-bottom: 8px;">🧩 مجمع البرومبتات</h3>
    <textarea id="promptBuilder" class="builder-textarea" placeholder="الأوامر المختارة ستظهر هنا..."></textarea>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="copyBuilder()">📋 نسخ الكود</button>
      <button class="btn btn-secondary" onclick="shareTXTBuilder()">📤 مشاركة TXT</button>
      <button class="btn btn-accent" onclick="exportBuilderPNG()">🖼️ مشاركة PNG</button>
      <button class="btn btn-danger" onclick="clearBuilder()">مسح</button>
    </div>
  </div>

  <!-- Cards Main Area -->
  <main style="margin-top: 16px;">
    <div class="commands-grid" id="commandsGrid"></div>
  </main>
</div>

<div class="toast" id="toast">تمت العملية بنجاح!</div>

<!-- Hidden Canvas for Image Export -->
<div id="exportCardCanvas" style="position: absolute; left:-9999px; top:-9999px; width:450px; background:#090d16; color:#fff; padding:24px; border-radius:16px; border:2px solid #00f2fe;">

  <p id="cardDescText" style="color:#ccc; font-size:0.95rem; line-height:1.6;"></p>
</div>

  let currentCategory = "الكل"
  let showOnlyFavs = false;
  let favorites = JSON.parse(localStorage.getItem("promptFav") || "[]");
  let customCmds = JSON.parse(localStorage.getItem("customCmds") || "[]");
  const builder = document.getElementById("promptBuilder");

  function allItems() {
    let arr = [];
    Object.entries(library).forEach(([cat, items]) => {
      items.forEach(item => arr.push({...item, category: cat}));
    });
    return [...arr, ...customCmds];
  }

  function renderCategories() {
    const categoriesDiv = document.getElementById("categories");
    const cats = ["الكل", ...Object.keys(library)];
    if(customCmds.length) cats.push("خاص بي");

    categoriesDiv.innerHTML = cats.map(cat => `
      <button class="cat-pill ${cat === currentCategory && !showOnlyFavs ? 'active' : ''}" 
              onclick="selectCategory('${cat}')">${cat}</button>
    `).join('');
  }

  function selectCategory(cat) {
    currentCategory = cat;
    showOnlyFavs = false;
    document.getElementById("favFilterBtn").style.borderColor = "var(--border)";
    renderCategories();
    renderCommands();
  }

  function toggleFavFilter() {
    showOnlyFavs = !showOnlyFavs;
    document.getElementById("favFilterBtn").style.borderColor = showOnlyFavs ? "var(--primary)" : "var(--border)";
    renderCategories();
    renderCommands();
  }

  function renderCommands() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const grid = document.getElementById("commandsGrid");
    grid.innerHTML = "";

    let filtered = allItems().filter(item => {
      const matchesSearch = item.c.toLowerCase().includes(query) || item.d.toLowerCase().includes(query);
      const matchesCat = currentCategory === "الكل" || item.category === currentCategory;
      const matchesFav = !showOnlyFavs || favorites.includes(item.c);
      return matchesSearch && matchesCat && matchesFav;
    });

    if(filtered.length === 0) {
      grid.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding:30px;">لا توجد نتائج مطابقة</div>`;
      return;
    }

    filtered.forEach(item => {
      const isFav = favorites.includes(item.c);
      const card = document.createElement("div");
      card.className = "command-card";
      card.innerHTML = `
        <div>
          <div class="command-code">${item.c}</div>
          <p class="command-desc">${item.d}</p>
        </div>
        <div class="card-actions">
          <button class="card-btn" onclick="addBuilder('${item.c}')">➕ أضف للمنشئ</button>
          <button class="card-btn" onclick="toggleFavorite('${item.c}')">${isFav ? '★ المفضلة' : '☆ مفضلة'}</button>
          <button class="card-btn" onclick="shareCardPNG('${item.c}', '${item.d}', '${item.category}')">🖼️ مشاركة PNG</button>
          <button class="card-btn" onclick="shareCardTXT('${item.c}', '${item.d}')">📄 مشاركة TXT</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function addBuilder(c) {
    let lines = builder.value.split('\n').filter(x => x.trim());
    if(!lines.includes(c)) {
      lines.push(c);
      builder.value = lines.join('\n');
      showToast("تمت الإضافة لشبكة المنشئ");
    }
  }

  function toggleFavorite(c) {
    favorites = favorites.includes(c) ? favorites.filter(x => x !== c) : [...favorites, c];
    localStorage.setItem("promptFav", JSON.stringify(favorites));
    renderCommands();
  }

  function promptAddCustomCommand() {
    const c = prompt("أدخل كود الأمر (مثال: /my_command):");
    const d = prompt("أدخل وصف الأمر:");
    if(c && d) {
      customCmds.push({c, d, category: "خاص بي"});
      localStorage.setItem("customCmds", JSON.stringify(customCmds));
      renderCategories();
      renderCommands();
      showToast("تمت إضافة الأمر الخاص بك!");
    }
  }

  /* Single Card Share Functions */
  async function shareCardTXT(c, d) {
    const textData = `الأمر: ${c}\nالوصف: ${d}`;
    if (navigator.share) {
      try {
        await navigator.share({ title: c, text: textData });
      } catch (e) {}
    } else {
      navigator.clipboard.writeText(textData);
      showToast("تم نسخ بيانات الأمر نصياً!");
    }
  }

  async function shareCardPNG(c, d, cat) {
    document.getElementById("cardCommandText").textContent = c;
    document.getElementById("cardDescText").textContent = d;
    document.getElementById("cardCategoryTag").textContent = cat || "أمر بصري";
    
    const canvas = document.getElementById("exportCardCanvas");
    showToast("جاري إعداد الصورة...");

    html2canvas(canvas, { backgroundColor: null, scale: 2 }).then(cvs => {
      cvs.toBlob(async (blob) => {
        const file = new File([blob], `${c.replace('/', '')}.png`, { type: 'image/png' });
        if (navigator.share && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: c, text: d });
          } catch(e) {}
        } else {
          const a = document.createElement('a'); 
          a.href = cvs.toDataURL("image/png"); 
          a.download = `${c.replace('/', '')}.png`; 
          a.click();
          showToast("تم تحفيز تنزيل الصورة!");
        }
      });
    });
  }

  /* Builder Global Share Functions */
  async function shareTXTBuilder() {
    const text = builder.value.trim();
    if(!text) return showToast("المنشئ فارغ!");
    if (navigator.share) {
      try {
        await navigator.share({ title: 'أوامر مجمعة', text: text });
      } catch(e) {}
    } else {
      navigator.clipboard.writeText(text);
      showToast("تم النسخ للحافظة!");
    }
  }

  function exportBuilderPNG() {
    if(!builder.value.trim()) return showToast("المنشئ فارغ!");
    shareCardPNG("أوامر مجمعة", builder.value.trim(), "منشئ البرومبتات");
  }

  function copyBuilder() { 
    if(!builder.value.trim()) return showToast("المنشئ فارغ!");
    navigator.clipboard.writeText(builder.value); 
    showToast("تم نسخ الكود!"); 
  }
  
  function clearBuilder() { builder.value = ""; }

  function exportTXT() {
    const data = allItems().map(i => i.c + " - " + i.d).join("\n");
    const blob = new Blob([data], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "commands.txt";
    a.click();
    showToast("تم تصدير كل الأوامر نصياً!");
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; 
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  document.getElementById("searchInput").addEventListener("input", renderCommands);
  
  // Initialization
  renderCategories(); 
  renderCommands();
</script>
